name: Dunkler Krieger - Talente prüfen
on:
  pull_request:
    paths:
      - 'index.html'
      - 'talentplaner.html'
      - 'tests/talent-audit.cjs'
      - '.github/workflows/talent-tests.yml'
  workflow_dispatch:
jobs:
  talent-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Alle 54 Talentknoten und 9 Grundtalente prüfen
        run: node tests/talent-audit.cjs
