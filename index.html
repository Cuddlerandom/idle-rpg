<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Idle RPG – Grünwald</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b20;color:#f4ead0;font:15px system-ui,sans-serif}main{max-width:550px;margin:auto;padding:15px}h1{font-size:23px;margin:8px 0}h2{font-size:17px}section{background:#203039;border:2px solid #3f5a54;border-radius:12px;padding:12px;margin:12px 0}button{background:#c6a15b;border:0;border-radius:8px;padding:10px;color:#182320;font-weight:700;margin:3px;touch-action:manipulation}button:disabled{opacity:.4}.scene{height:210px;background:linear-gradient(#294b52 0 60%,#47744e 60% 76%,#334e36 76%);position:relative;overflow:hidden;border:3px solid #728d5c;border-radius:8px}.scene:before{content:'♣  ♣     ♣   ♣';position:absolute;top:12px;left:8px;font-size:62px;color:#24472c;opacity:.8}.fighters{position:absolute;bottom:25px;left:0;width:100%;display:flex;align-items:end;justify-content:space-around;font-size:65px;image-rendering:pixelated}.hit{animation:bump .2s}@keyframes bump{50%{transform:translateX(12px)}}.bar{background:#4c3838;height:13px;border-radius:7px;overflow:hidden;margin:5px 0}.bar>div{height:100%;background:#5fc66b}.enemybar>div{background:#d96b5c}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.small{color:#c0cbbd;font-size:12px}.item{border-top:1px solid #4b605c;padding:9px 0}.common{color:#ddd}.uncommon{color:#6ddd87}.rare{color:#74adff}.epic{color:#d28dff}.legendary{color:#ffbc4c}#log{min-height:30px;color:#e7d5a5}nav{display:flex;gap:5px;flex-wrap:wrap}nav button{flex:1}.hidden{display:none}
</style></head><body><main><h1>⚔️ Idle RPG <span class="small">V0.1</span></h1><div class="small">🌲 Grünwald · Automatischer Kampf · Speichert auf diesem Gerät</div>
<section><div class="stats"><b id="wave">Welle 1 / 10</b><b id="gold">🪙 0</b></div><div class="scene"><div class="fighters"><span id="hero">🛡️</span><span id="monster">👺</span></div></div><div class="stats"><b id="heroName">Held</b><b id="enemyName">Goblin</b></div><div class="bar"><div id="heroBar"></div></div><div class="bar enemybar"><div id="enemyBar"></div></div><div class="stats small"><span id="hp"></span><span id="ehp"></span></div><p id="log">Der Kampf beginnt …</p><div class="stats"><span id="level"></span><span id="xp"></span></div></section>
<nav><button onclick="tab('up')">⬆️ Upgrades</button><button onclick="tab('inv')">🎒 Inventar</button><button onclick="tab('equip')">⚔️ Ausrüstung</button></nav>
<section id="up"><h2>Gold-Upgrades</h2><div id="upgrades"></div></section><section id="inv" class="hidden"><h2>Inventar</h2><div id="inventory"></div></section><section id="equip" class="hidden"><h2>Ausrüstung</h2><div id="equipment"></div></section>
<p class="small">Kein Offline-Fortschritt. Der Kampf läuft nur, solange diese Seite geöffnet und aktiv ist.</p></main>
<script>
const key='idle-rpg-gruenwald-v01';
const slots=['Waffe','Rüstung','Ring'],rarities=[['Gewöhnlich','common',1],['Ungewöhnlich','uncommon',1.35],['Selten','rare',1.8],['Episch','epic',2.5],['Legendär','legendary',4]];
const fresh=()=>({gold:0,xp:0,level:1,wave:1,highest:1,up:{atk:0,hp:0,def:0,speed:0,crit:0},inv:[],equip:{},heroHp:100,kills:0});
let s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(key)||'{}'));s.up=Object.assign(fresh().up,s.up);s.equip=s.equip||{};s.inv=Array.isArray(s.inv)?s.inv:[]}catch(e){s=fresh()}
let enemy,enemyHp,heroTimer=0,enemyTimer=0,last=performance.now(),saveTimer=0,log='Kampf beginnt …';
const el=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function stats(){let bonus={atk:0,hp:0,def:0,crit:0};Object.values(s.equip).forEach(i=>{if(i)bonus[i.stat]+=i.value});return {atk:10+s.up.atk*2+(s.level-1)*2+bonus.atk,hp:100+s.up.hp*15+(s.level-1)*10+bonus.hp,def:2+s.up.def+Math.floor((s.level-1)/3)+bonus.def,crit:Math.min(60,5+s.up.crit+bonus.crit),speed:Math.max(450,1000-s.up.speed*45)}}
function makeEnemy(){const boss=s.wave===10;let w=s.wave;enemy={name:boss?'Goblin-Häuptling':w<=3?'Waldgoblin':w<=6?'Waldwolf':'Goblin-Krieger',hp:boss?300:38+w*9,atk:boss?17:3+Math.floor(w*1.3),def:boss?5:Math.floor(w/3),speed:boss?1700:2100-w*45,icon:boss?'👹':w<=3?'👺':w<=6?'🐺':'👹'};enemyHp=enemy.hp;el('monster').textContent=enemy.icon;heroTimer=enemyTimer=0}
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
function drop(boss){if(Math.random()>(boss?.8:.22))return;const r=Math.random();let tier=r<.005?4:r<.03?3:r<.13?2:r<.35?1:0;const slot=slots[rnd(0,2)],stat=slot==='Waffe'?'atk':slot==='Rüstung'?(Math.random()<.5?'hp':'def'):(Math.random()<.5?'crit':'atk');const base={atk:3,hp:12,def:2,crit:2}[stat];let item={id:Date.now()+Math.random(),slot,stat,value:Math.max(1,Math.round(base*rarities[tier][2]*(1+Math.random()*.6))),tier,name:rarities[tier][0]+' '+({Waffe:'Schwert',Rüstung:'Panzer',Ring:'Ring'}[slot])};s.inv.push(item);log='🎁 Beute: '+item.name+' gefunden!'}
function win(){s.kills++;s.gold+=10+s.wave*4;s.xp+=12+s.wave*3;const need=()=>s.level*45;while(s.xp>=need()){s.xp-=need();s.level++;s.heroHp=stats().hp;log='⭐ Levelaufstieg! Level '+s.level}drop(s.wave===10);if(s.wave<10){s.wave++;s.highest=Math.max(s.highest,s.wave)}else{log='👑 Boss besiegt! Grünwald wird erneut durchlaufen.';s.wave=1}s.heroHp=Math.min(stats().hp,s.heroHp+Math.round(stats().hp*.3));makeEnemy();save()}
function lose(){log='💀 Besiegt! Du startest wieder bei Welle 1.';s.wave=1;s.heroHp=stats().hp;makeEnemy();save()}
function tick(dt){if(document.hidden)return;const st=stats();heroTimer+=dt;enemyTimer+=dt;if(heroTimer>=st.speed){heroTimer-=st.speed;let dmg=Math.max(1,st.atk-enemy.def);if(Math.random()*100<st.crit)dmg=Math.round(dmg*1.5);enemyHp-=dmg;el('hero').classList.remove('hit');void el('hero').offsetWidth;el('hero').classList.add('hit');log='⚔️ Du verursachst '+dmg+' Schaden.';if(enemyHp<=0){win();return}}if(enemyTimer>=enemy.speed){enemyTimer-=enemy.speed;let dmg=Math.max(1,enemy.atk-st.def);s.heroHp-=dmg;if(s.heroHp<=0){lose();return}}}
function upgradeCost(k){return Math.round(({atk:25,hp:25,def:30,speed:45,crit:55}[k])*Math.pow(1.55,s.up[k]))}
function upgrade(k){let c=upgradeCost(k);if(s.gold<c)return;s.gold-=c;s.up[k]++;if(k==='hp')s.heroHp+=15;save();render()}
function equip(id){const i=s.inv.find(x=>x.id===id);if(!i)return;const old=s.equip[i.slot];if(old)s.inv.push(old);s.inv=s.inv.filter(x=>x.id!==id);s.equip[i.slot]=i;s.heroHp=Math.min(s.heroHp,stats().hp);save();render()}
function sell(id){const i=s.inv.find(x=>x.id===id);if(!i)return;s.gold+=10*(i.tier+1);s.inv=s.inv.filter(x=>x.id!==id);save();render()}
function tab(name){['up','inv','equip'].forEach(x=>el(x).classList.toggle('hidden',x!==name));render()}
function render(){const st=stats();el('wave').textContent='Welle '+s.wave+' / 10';el('gold').textContent='🪙 '+s.gold;el('enemyName').textContent=enemy.name;el('heroName').textContent='Held – Level '+s.level;el('heroBar').style.width=Math.max(0,s.heroHp/st.hp*100)+'%';el('enemyBar').style.width=Math.max(0,enemyHp/enemy.hp*100)+'%';el('hp').textContent=Math.ceil(s.heroHp)+' / '+st.hp+' LP';el('ehp').textContent=Math.max(0,Math.ceil(enemyHp))+' / '+enemy.hp+' LP';el('level').textContent='⚔️ Angriff '+st.atk+' · 🛡️ '+st.def;el('xp').textContent='✨ XP '+s.xp+'/'+(s.level*45);el('log').textContent=log;
const names={atk:'Angriff +2',hp:'Leben +15',def:'Verteidigung +1',speed:'Angriffstempo',crit:'Kritisch +1 %'};
el('upgrades').innerHTML=Object.keys(names).map(k=>'<div class="stats item"><span>'+names[k]+' <small>(Stufe '+s.up[k]+')</small></span><button '+(s.gold<upgradeCost(k)?'disabled':'')+' onclick="upgrade(\''+k+'\')">🪙 '+upgradeCost(k)+'</button></div>').join('');
const attr={atk:'Angriff',hp:'Leben',def:'Verteidigung',crit:'Kritisch %'};
el('inventory').innerHTML=s.inv.length?s.inv.map(i=>'<div class="item"><b class="'+rarities[i.tier][1]+'">'+i.name+'</b><div class="small">'+attr[i.stat]+' +'+i.value+'</div><button onclick="equip('+i.id+')">Ausrüsten</button><button onclick="sell('+i.id+')">Verkaufen</button></div>').join(''):'Noch keine Gegenstände gefunden.';
el('equipment').innerHTML=slots.map(slot=>{let i=s.equip[slot];return '<div class="item"><b>'+slot+'</b><div class="small">'+(i?i.name+' · '+attr[i.stat]+' +'+i.value:'Leer')+'</div></div>'}).join('')}
s.heroHp=Math.min(s.heroHp,stats().hp);makeEnemy();render();document.addEventListener('visibilitychange',()=>{last=performance.now()});function frame(now){let dt=Math.min(100,now-last);last=now;tick(dt);saveTimer+=dt;if(saveTimer>1000){saveTimer=0;render();save()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
