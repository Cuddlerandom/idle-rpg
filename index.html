/* HUD V1.0: dark-fantasy aesthetics with mobile-first clarity; sprite size unchanged. */
:root{--hud-gold:#e4bf80;--hud-border:#5a635d;--hud-muted:#bac7c1}
body{background:radial-gradient(ellipse at top,#26363b 0,#11191f 55%,#0b1218 100%);color:#f3ecdd}
main{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom))}
h1{color:var(--hud-gold);letter-spacing:.025em}
.panel{background:linear-gradient(145deg,#26363b,#18252c);border-color:var(--hud-border);box-shadow:0 3px 15px #0003}
#battle{border-color:#8a7656;padding:10px}

#battle .effect-row{margin:7px 0}

/* Mobile HUD V3: fixed battlefield, bottom tabs and independent menu drawer */
body.mobile-rpg main{padding-bottom:90px}
#rpgHome[hidden],nav[hidden]{display:none!important}
#rpgHome{text-align:center;min-height:65dvh;padding:30px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.rpg-home-symbol{font-size:70px;filter:drop-shadow(0 0 18px #b38b51)}
#rpgHome h2{font-size:30px;margin:0}
.rpg-home-actions{width:100%;display:grid;gap:12px;max-width:360px}
.rpg-home-actions button,.rpg-home-link{width:100%;min-height:51px;display:flex;justify-content:center;align-items:center;text-decoration:none;border-radius:9px;background:#344f50;color:#fff;font-weight:750}
#rpgStart{background:#c7a568;color:#18221e;font-size:17px}
#rpgDrawer{display:none;position:fixed;z-index:90;inset:8dvh max(0px,calc((100vw - 600px)/2)) 0;background:#17272e;border:1px solid #6e8579;border-radius:18px 18px 0 0;box-shadow:0 -12px 60px #000c;overflow:hidden;flex-direction:column}
#rpgDrawer.open{display:flex}
.rpg-drawer-top{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #47605d;background:#22373d}
#rpgDrawerBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 12px max(24px,env(safe-area-inset-bottom))}
#rpgDrawerBody>.panel{margin:0;border:0;background:transparent;padding:6px 0}
body.rpg-drawer-open nav[aria-label="Spielnavigation"]{z-index:91}
body.rpg-running nav[aria-label="Spielnavigation"]{position:fixed;z-index:70;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,600px);margin:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#16282f;border-top:1px solid #78936e;box-shadow:0 -4px 20px #0008}
body.rpg-running nav[aria-label="Spielnavigation"] button{min-height:48px}
body.rpg-home #battle,body.rpg-home #blessingPanel,body.rpg-home nav[aria-label="Spielnavigation"]{display:none!important}
body.rpg-home #runEnd:not(.hidden){display:block!important;margin-bottom:12px}
body.rpg-running #runEnd{display:none!important}
body.rpg-running .scene{height:clamp(175px,29dvh,275px)}
body.rpg-running .game-header{margin-bottom:6px}
body.rpg-running #battle{margin-top:4px}

/* Mandatory blessing choices remain reachable without scrolling the battlefield. */

/* Zone-based combat backgrounds */
#battleScene.zone-1 { background: radial-gradient(ellipse at 50% 110%, #2a3d28 0%, transparent 45%), linear-gradient(#0f1a14 0 60%, #2c3d2a 60% 72%, #141c12 72%); border-color: #4a6a4a; }

#battleScene.zone-2 { background: radial-gradient(ellipse at 50% 110%, #3a2a20 0%, transparent 45%), linear-gradient(#1a1210 0 58%, #4a3428 58% 70%, #1c1410 70%); border-color: #8a5a3a; }
#battleScene.zone-2:after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 40%, #6a3a2a22 0%, transparent 40%), radial-gradient(circle at 70% 60%, #4a2a1a33 0%, transparent 50%); pointer-events: none; }

<script>
function updateZoneBackground() {
  const scene = document.getElementById('battleScene');
  if (!scene) return;
  const waveEl = document.getElementById('wave');
  const waveText = waveEl ? waveEl.textContent : '';
  const match = waveText.match(/(\d+)/);
  const wave = match ? parseInt(match[1], 10) : 1;
  const zone = Math.floor((wave - 1) / 50) + 1;
  scene.classList.remove('zone-1', 'zone-2', 'zone-boss');
  scene.classList.add(zone >= 2 ? 'zone-2' : 'zone-1');
  if (wave % 50 === 0) scene.classList.add('zone-boss');
}
setInterval(updateZoneBackground, 800);
